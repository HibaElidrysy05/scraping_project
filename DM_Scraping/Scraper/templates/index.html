<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recherche</title>
</head>
<body>

    <h1>Recherche de produits</h1>

    <form method="GET" action="{% url 'index' %}">
        <input
            type="text"
            name="query"
            placeholder="Rechercher..."
            value="{{ query }}"
        >

        <select name="source">
            <option value="jumia" {% if source == "jumia" %}selected{% endif %}>Jumia</option>
            <option value="aliexpress" {% if source == "aliexpress" %}selected{% endif %}>AliExpress</option>
        </select>

        <button type="submit">Submit</button>
    </form>

    <hr>

    {% if products %}
        <h2>Résultats :</h2>

        {% for product in products %}
            <div>
                <h3>{{ product.title }}</h3>

                {% if product.price %}
                    <p style="color:#e44d26; font-weight:bold;">{{ product.price }}</p>
                {% endif %}

                {% if product.img_link %}
                    <img src="{{ product.img_link }}" width="150">
                {% endif %}

                {% if product.link %}
                    <br>
                    <a href="{{ product.link }}" target="_blank">Voir le produit</a>
                {% endif %}
            </div>
            <hr>
        {% endfor %}

    {% endif %}

</body>
</html>
